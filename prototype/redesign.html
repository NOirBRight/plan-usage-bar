<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUB redesign prototype (throwaway)</title>
  <!--
    Three GNOME-native redesigns of the PUB Strip + Popover, switchable via ?variant=A|B|C.
    Question: which information architecture reads best inside GNOME Shell, and where do Settings live?
      A  List  · Strip 单行数字；Popover 是列表 Overview，点行推入 Detail；Enabled/Pinned 留在 Popover，登录去 prefs 窗口
      B  Board · Strip 只有图标+细条；Popover 一屏铺开全部 Provider 与全部 Window，无导航；Settings 全部去 prefs 窗口
      C  Ring  · Strip 圆环+数字；Popover 是 2 列仪表网格，点 tile 就地展开；Pinned/顺序在 Popover 的编辑模式里改
    All colours follow a fake "Shell theme" (dark/light toggle in the badge) instead of hard-coded light values.
    Data = ~/.cache/pub/snapshot.json from 2026-09-14 (Claude really was HTTP 429 at the time).
  -->
  <style>
    :root {
      --panel: 32px;
      --ok: #26a269; --warn: #e5a50a; --crit: #c01c28; --accent: #3584e4;
      --font: "Cantarell", "Adwaita Sans", "Inter", "Ubuntu", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--font); overflow: hidden; background: #1b1f2a; }
    .wallpaper {
      position: fixed; inset: 0;
      background:
        radial-gradient(900px 600px at 80% 15%, #3b6ea5 0%, transparent 55%),
        radial-gradient(800px 500px at 15% 85%, #7b5ea7 0%, transparent 50%),
        linear-gradient(160deg, #1e2a3a 0%, #2e4a6a 50%, #6a8fb5 100%);
    }
    button { font-family: inherit; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ===== fake GNOME top bar ===== */
    .panel {
      position: relative; z-index: 5;
      height: var(--panel); display: flex; align-items: center;
      background: #000; color: #fff; padding: 0 6px 0 10px;
      font: 600 13px/1 var(--font);
    }
    .panel .activities { padding: 0 6px; }
    .panel .clock { margin-left: auto; margin-right: auto; font-weight: 700; }
    .panel .sys { display: flex; gap: 10px; padding: 0 10px; opacity: .95; }
    .panel-btn {
      height: 26px; border: 0; border-radius: 13px; background: transparent; color: #fff; cursor: pointer;
      display: flex; align-items: center; gap: 5px; padding: 0 7px;
    }
    .panel-btn:hover { background: rgba(255,255,255,.12); }
    .panel-btn.on { background: rgba(255,255,255,.2); }
    .panel-btn svg { display: block; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .t-warn { color: var(--warn); } .t-crit { color: var(--crit); } .t-dim { opacity: .5; }

    /* ===== fake Shell popover, theme follows .dark / .light on body ===== */
    body.dark {
      --pop-bg: #242424; --pop-border: rgba(255,255,255,.1);
      --fg: #ffffff; --fg2: rgba(255,255,255,.62); --fg3: rgba(255,255,255,.4);
      --sep: rgba(255,255,255,.1); --hover: rgba(255,255,255,.08); --active: rgba(255,255,255,.14);
      --track: rgba(255,255,255,.14); --card: rgba(255,255,255,.06); --card-on: rgba(255,255,255,.1);
      --entry: rgba(255,255,255,.08); --win-bg: #1e1e1e; --win-hdr: #303030;
    }
    body.light {
      --pop-bg: #fafafa; --pop-border: rgba(0,0,0,.12);
      --fg: #2e3436; --fg2: rgba(0,0,0,.6); --fg3: rgba(0,0,0,.38);
      --sep: rgba(0,0,0,.1); --hover: rgba(0,0,0,.06); --active: rgba(0,0,0,.1);
      --track: rgba(0,0,0,.12); --card: rgba(0,0,0,.04); --card-on: rgba(0,0,0,.08);
      --entry: rgba(0,0,0,.06); --win-bg: #fafafa; --win-hdr: #ebebeb;
    }
    .pop {
      position: absolute; top: 6px; right: 12px; z-index: 6;
      background: var(--pop-bg); color: var(--fg);
      border: 1px solid var(--pop-border); border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
      font-size: 13px; overflow: hidden;
    }
    .pop .hdr { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 16px; }
    .pop .hdr h1 { margin: 0; font: 700 15px/1.2 var(--font); flex: 1; }
    .pop .hdr .stamp { color: var(--fg2); font-size: 12px; }
    .ibtn {
      width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent; color: var(--fg);
      display: grid; place-items: center; cursor: pointer;
    }
    .ibtn:hover { background: var(--hover); }
    .ibtn.on { background: var(--active); }
    .ibtn svg { display: block; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 3px; }
    .sep { height: 1px; background: var(--sep); }
    .link-row {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 16px; border: 0;
      background: transparent; color: var(--fg); text-align: left; cursor: pointer; font-size: 13px;
    }
    .link-row:hover { background: var(--hover); }
    .link-row .go { margin-left: auto; color: var(--fg3); }
    .switch {
      width: 40px; height: 22px; border-radius: 11px; border: 0; padding: 0; cursor: pointer;
      background: var(--track); position: relative; flex: none;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 8px;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .12s;
    }
    .switch.on { background: var(--accent); }
    .switch.on::after { left: 21px; }
    .switch:disabled { opacity: .4; cursor: default; }
    .seg { display: inline-flex; border-radius: 8px; background: var(--card); padding: 2px; }
    .seg button {
      border: 0; background: transparent; color: var(--fg2); padding: 4px 10px; border-radius: 6px;
      font-size: 12px; cursor: pointer;
    }
    .seg button.on { background: var(--pop-bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--card-on); color: var(--fg2); }
    .err-row { display: flex; align-items: center; gap: 8px; color: var(--crit); font-size: 12px; }

    /* ===== fake Adwaita prefs window (shared "prefs.js" stand-in) ===== */
    .win {
      position: absolute; z-index: 20; top: 90px; left: 50%; transform: translateX(-50%);
      width: 520px; max-height: calc(100vh - 160px); display: flex; flex-direction: column;
      background: var(--win-bg); color: var(--fg); border-radius: 12px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4);
      font-size: 13px;
    }
    .win .titlebar {
      height: 46px; display: flex; align-items: center; justify-content: center; position: relative;
      background: var(--win-hdr); font-weight: 700; flex: none;
    }
    .win .titlebar .close {
      position: absolute; right: 8px; top: 9px; width: 28px; height: 28px; border-radius: 14px;
      border: 0; background: var(--hover); color: var(--fg); cursor: pointer;
    }
    .win .body { overflow: auto; padding: 18px 24px 24px; }
    .adw-group { margin-bottom: 22px; }
    .adw-group h3 { margin: 0 0 8px; font: 700 14px var(--font); }
    .adw-group .desc { margin: -4px 0 8px; color: var(--fg2); font-size: 12px; }
    .adw-list { border-radius: 10px; overflow: hidden; background: var(--card); }
    .adw-row {
      display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 12px;
      border-bottom: 1px solid var(--sep);
    }
    .adw-row:last-child { border-bottom: 0; }
    .adw-row .t { flex: 1; }
    .adw-row .t small { display: block; color: var(--fg2); font-size: 11px; margin-top: 2px; }
    .adw-row input {
      flex: 1; height: 30px; border: 0; border-radius: 6px; background: var(--entry); color: var(--fg);
      padding: 0 10px; font: 13px var(--font);
    }
    .adw-row .btn {
      height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--card-on); color: var(--fg);
      cursor: pointer; font-size: 12px;
    }
    .adw-row .btn.sug { background: var(--accent); color: #fff; }
    .handle { color: var(--fg3); cursor: grab; }

    /* ===== chrome not part of the design ===== */
    .badge {
      position: fixed; top: 44px; left: 12px; z-index: 40; width: 300px;
      font: 11px/1.4 ui-monospace, monospace;
      color: #fff; background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px; padding: 8px 10px;
    }
    .badge pre { margin: 6px 0 0; white-space: pre-wrap; }
    .badge .ctrls { display: flex; flex-wrap: wrap; gap: 4px; }
    .badge .ctrls button {
      font: 11px ui-monospace, monospace; border: 1px solid rgba(255,255,255,.3); background: #222; color: #fff;
      border-radius: 5px; padding: 2px 6px; cursor: pointer;
    }
    .ctx {
      position: fixed; z-index: 30; min-width: 180px; display: none;
      background: var(--pop-bg); color: var(--fg); border: 1px solid var(--pop-border);
      border-radius: 12px; padding: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .ctx.open { display: block; }
    .ctx button {
      display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit;
      font: 13px/30px var(--font); padding: 0 12px; border-radius: 7px; cursor: pointer;
    }
    .ctx button:hover { background: var(--hover); }
    .ctx .sep { margin: 5px 0; }
    .switcher {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50;
      display: flex; align-items: center; gap: 10px;
      background: #111; color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 8px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45); font: 13px/1 var(--font); user-select: none;
    }
    .switcher button {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid #fff; background: #000; color: #fff; cursor: pointer;
    }
    .switcher .label { min-width: 320px; text-align: center; }
    .explain {
      position: fixed; right: 16px; bottom: 76px; z-index: 40; width: 380px;
      font: 12px/1.5 var(--font); color: #fff; background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 10px 12px;
    }
    .explain b { display: block; margin-bottom: 4px; }

    /* ===== Variant A: List ===== */
    .a-pop { width: 360px; }
    .a-row {
      display: grid; grid-template-columns: 20px 1fr auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 5px;
      align-items: center; width: 100%; padding: 9px 16px; border: 0; background: transparent; color: var(--fg);
      text-align: left; cursor: pointer;
    }
    .a-row:hover { background: var(--hover); }
    .a-row .ic { grid-row: 1 / span 2; display: grid; place-items: center; }
    .a-row .name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .a-row .name .win-l { font-weight: 400; color: var(--fg2); font-size: 12px; }
    .a-row .pct { font-weight: 700; font-size: 14px; text-align: right; }
    .a-row .reset { color: var(--fg2); font-size: 11px; text-align: right; }
    .a-row.unpinned .ic, .a-row.unpinned .name { opacity: .6; }
    .a-detail { padding: 6px 16px 10px; }
    .a-big { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 4px; }
    .a-big .n { font: 700 34px/1 var(--font); }
    .a-big .u { color: var(--fg2); }
    .a-big .r { margin-left: auto; color: var(--fg2); font-size: 12px; }
    .a-win { display: grid; grid-template-columns: 1fr auto; row-gap: 5px; column-gap: 10px; padding: 9px 0; border-top: 1px solid var(--sep); }
    .a-win .l { font-weight: 600; }
    .a-win .v { font-weight: 700; }
    .a-win .bar { grid-column: 1 / -1; }
    .a-win .m { grid-column: 1 / -1; color: var(--fg2); font-size: 11px; }
    .a-set { padding: 4px 0 6px; }
    .a-set-row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; }
    .a-set-row .nm { flex: 1; }
    .a-set-row .lbl { color: var(--fg2); font-size: 11px; width: 42px; text-align: right; }
    .a-set-row .ord { display: flex; gap: 2px; }
    .a-set-row .ord button { width: 22px; height: 22px; border: 0; border-radius: 11px; background: transparent; color: var(--fg2); cursor: pointer; }
    .a-set-row .ord button:hover { background: var(--hover); }
    .a-set-row .ord button:disabled { opacity: .25; cursor: default; }

    .a-group { padding: 4px 16px 6px; color: var(--fg2); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .a-prow {
      display: grid; grid-template-columns: 20px 1fr auto auto; column-gap: 12px; align-items: center;
      width: 100%; padding: 8px 10px 8px 16px; border: 0; background: transparent; color: var(--fg); text-align: left; cursor: pointer;
    }
    .a-prow:hover { background: var(--hover); }
    .a-prow.off .ic, .a-prow.off .nm { opacity: .5; }
    .a-prow .nm { font-weight: 600; }
    .a-prow .st { font-size: 11px; color: var(--fg2); margin-top: 2px; }
    .a-prow .st.bad { color: var(--crit); }
    .a-prow .pinb { width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: var(--fg3); display: grid; place-items: center; cursor: pointer; }
    .a-prow .pinb:hover { background: var(--active); }
    .a-prow .pinb.on { color: var(--accent); }
    .a-prow .grip { color: var(--fg3); cursor: grab; padding: 4px 6px; font-size: 14px; letter-spacing: -2px; }
    .a-prow.dragging { opacity: .35; }
    .a-prow.over { box-shadow: inset 0 2px 0 var(--accent); }
    .a-card { margin: 4px 16px 10px; padding: 12px 14px; border-radius: 12px; background: var(--card); }
    .a-card .t { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .a-card .d { color: var(--fg2); font-size: 12px; line-height: 1.45; }
    .a-card .acts { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
    .btn { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--card-on); color: var(--fg); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--active); }
    .btn.sug { background: var(--accent); color: #fff; }
    .btn.sug:hover { background: #2f6fd0; }
    .btn.quiet { background: transparent; color: var(--fg2); padding: 0 6px; }
    .a-entry { flex: 1; min-width: 160px; height: 32px; border: 0; border-radius: 8px; background: var(--entry); color: var(--fg); padding: 0 10px; font: 13px var(--font); }
    .a-row2 { display: flex; align-items: center; gap: 10px; padding: 9px 16px; }
    .a-row2 .l { flex: 1; }
    .a-row2 .l small { display: block; color: var(--fg2); font-size: 11px; margin-top: 2px; }
    .radio { width: 18px; height: 18px; border-radius: 9px; border: 2px solid var(--fg3); flex: none; position: relative; }
    .radio.on { border-color: var(--accent); }
    .radio.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
    .a-row2.pick { cursor: pointer; }
    .a-row2.pick:hover { background: var(--hover); }
    .wait { display: inline-flex; align-items: center; gap: 8px; color: var(--fg2); font-size: 12px; }
    .wait .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--accent); animation: spin .9s linear infinite; }

    /* ===== Variant B: Board ===== */
    .b-meter { width: 30px; height: 26px; padding: 0; display: grid; grid-template-rows: 1fr 3px; justify-items: center; gap: 2px; border-radius: 6px; }
    .b-meter .ic { display: grid; place-items: center; align-self: end; }
    .b-meter .ln { width: 18px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
    .b-meter .ln span { display: block; height: 100%; }
    .b-pop { width: 440px; }
    .b-body { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; max-height: 70vh; overflow: auto; }
    .b-card { border-radius: 12px; background: var(--card); padding: 10px 12px 8px; border-left: 3px solid var(--card-on); }
    .b-card.unpinned { opacity: .72; }
    .b-card .top { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; }
    .b-card .nm { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .b-card .stamp { color: var(--fg3); font-size: 11px; }
    .b-card .top .pct { font: 700 20px/1 var(--font); }
    .b-wins { margin-top: 8px; display: grid; grid-template-columns: 110px 1fr 40px 100px; gap: 6px 10px; align-items: center; font-size: 12px; }
    .b-wins .l { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .b-wins .l.pri { font-weight: 700; }
    .b-wins .v { text-align: right; font-weight: 600; }
    .b-wins .r { color: var(--fg2); text-align: right; font-size: 11px; white-space: nowrap; }
    .b-wins .bar { height: 5px; }
    .b-extra { margin-top: 6px; color: var(--fg2); font-size: 11px; display: flex; gap: 12px; }
    .b-foot { display: flex; align-items: center; gap: 4px; padding: 6px 10px 8px; }
    .b-foot .grow { flex: 1; }
    .b-tip {
      position: absolute; top: 40px; z-index: 7; padding: 4px 9px; border-radius: 6px; font-size: 12px;
      background: var(--pop-bg); color: var(--fg); border: 1px solid var(--pop-border); box-shadow: 0 4px 12px rgba(0,0,0,.3);
      pointer-events: none; white-space: nowrap;
    }

    /* ===== Variant C: Ring ===== */
    .c-meter { gap: 4px; padding: 0 6px 0 5px; }
    .c-pop { width: 420px; }
    .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 12px 12px; }
    .c-tile {
      border: 0; border-radius: 14px; background: var(--card); color: var(--fg); text-align: left; cursor: pointer;
      display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px; align-items: center; position: relative;
    }
    .c-tile:hover { background: var(--card-on); }
    .c-tile.on { background: var(--card-on); box-shadow: inset 0 0 0 2px var(--accent); }
    .c-tile.unpinned { opacity: .7; }
    .c-tile .ring { position: relative; width: 56px; height: 56px; }
    .c-tile .ring .ic { position: absolute; inset: 0; display: grid; place-items: center; }
    .c-tile .nm { font-weight: 700; display: flex; gap: 6px; align-items: center; }
    .c-tile .pct { font: 700 22px/1.1 var(--font); }
    .c-tile .sub { color: var(--fg2); font-size: 11px; margin-top: 2px; }
    .c-tile.editing { grid-template-columns: 44px 1fr 44px; cursor: default; }
    .c-tile.editing .ring { width: 44px; height: 44px; }
    .c-tile.editing .pct { font-size: 18px; }
    .c-tile .ctl { display: grid; justify-items: center; gap: 6px; }
    .c-tile .edit-ord { display: flex; gap: 2px; }
    .c-tile .edit-ord span { width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; background: var(--hover); font-size: 12px; cursor: pointer; }
    .c-tile .edit-ord span:hover { background: var(--active); }
    .c-detail { grid-column: 1 / -1; border-radius: 14px; background: var(--card); padding: 12px 14px; }
    .c-detail .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .c-detail .head .nm { font-weight: 700; font-size: 14px; flex: 1; }
    .c-detail .wins { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    .c-win { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; background: var(--pop-bg); font-size: 11px; }
    .c-win .l { font-weight: 600; text-align: center; }
    .c-win .r { color: var(--fg2); text-align: center; }
    .c-links { display: flex; gap: 6px; margin-top: 10px; }
    .c-links button { flex: 1; height: 30px; border: 0; border-radius: 8px; background: var(--card-on); color: var(--fg); cursor: pointer; font-size: 12px; }
    .c-links button:hover { background: var(--active); }
  </style>
</head>
<body class="dark">
  <div class="wallpaper"></div>
  <div id="app" style="position:relative;height:100%"></div>

  <div class="badge">
    <div class="ctrls">
      <button data-b="theme">主题: <span id="bTheme"></span></button>
      <button data-b="mode">读法: <span id="bMode"></span></button>
      <button data-b="refresh">模拟刷新中</button>
      <button data-b="claude">Claude 429 ⇄ 正常</button>
      <button data-b="cursor">Cursor 耗尽 ⇄ 原值</button>
      <button data-b="pop">开/关 Popover</button>
    </div>
    <pre id="stateDump"></pre>
  </div>
  <div class="explain" id="explain"></div>
  <div class="ctx" id="ctx">
    <button data-act="refresh">立即刷新</button>
    <button data-act="settings">设置…</button>
    <button data-act="autostart">开机自启</button>
    <div class="sep"></div>
    <button data-act="exit">退出 PUB</button>
  </div>
  <div class="switcher">
    <button id="prev" aria-label="previous">←</button>
    <div class="label" id="switchLabel"></div>
    <button id="next" aria-label="next">→</button>

    const accentOf = (p) => (p.accent === "#111111" || p.accent === "#111") ? "var(--accent)" : p.accent;

    function bar(rem, h, color) {
      return `<div class="bar" style="${h ? `height:${h}px` : ""}"><span style="width:${frac(rem) * 100}%;background:${color || toneColor(rem)}"></span></div>`;
    }
    function ring(rem, size, stroke, color) {
      const r = (size - stroke) / 2, c = 2 * Math.PI * r, d = c * frac(rem);
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color || toneColor(rem)}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${d} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
    }
    function errText(p) {
      if (p.error === "signed out") return "未登录";
      if (p.error) return `抓取失败 · ${p.error}`;
      return "";
    }
    function panelShell(stripHtml, popHtml) {
      return `
        <div class="panel">
          <span class="activities">Activities</span>
          <span class="clock">9月15日 00:12</span>
          <div style="display:flex;align-items:center;gap:2px">${state.exited ? "" : stripHtml}</div>
          <div class="sys"><span>⏻</span></div>
        </div>
        ${state.popover && !state.exited ? popHtml : ""}
        ${state.prefs ? prefsWindow() : ""}`;
    }
    function ctrlBtn(extra) {
      return `<button class="panel-btn${state.popover ? " on" : ""} ${extra || ""}" data-ctrl="1" title="PUB">${icon("hub", 16)}</button>`;
    }
    function hdr(title, buttons) {
      return `<div class="hdr"><h1>${title}</h1><span class="stamp">${stamp()}</span>${buttons}</div>`;
    }
    const refreshBtn = () => `<button class="ibtn" data-act="refresh" title="立即刷新"><span class="${state.refreshing ? "spin" : ""}" style="display:grid">${icon("refresh", 16)}</span></button>`;
    const gearBtn = (act) => `<button class="ibtn${state.page === "settings" || state.edit ? " on" : ""}" data-act="${act}" title="设置">${icon("gear", 16)}</button>`;
    const modeSeg = () => `<span class="seg"><button data-mode="1" class="${state.remainingMode ? "on" : ""}">剩余</button><button data-mode="0" class="${state.remainingMode ? "" : "on"}">已用</button></span>`;
    const footLinks = (p) => `
      <div class="sep"></div>
      <button class="link-row" data-url="${p.usageUrl}">打开 ${p.name} 用量页<span class="go">↗</span></button>
      <button class="link-row" data-url="${p.statusUrl}">打开状态页<span class="go">↗</span></button>`;

    /* ---------- shared fake prefs.js window ---------- */
    function prefsWindow() {
      const full = state.variant === "B";
      const rows = providers.map((p, i) => `
        <div class="adw-row">
          ${full ? `<span class="handle">⋮⋮</span>` : ""}
          <span style="display:grid;place-items:center;width:18px">${icon(p.id, 16)}</span>
          <div class="t">${p.name}<small>${p.credentialSource === "pub" ? "PUB 凭据" : p.credentialSource === "cli" ? "读取官方 CLI 登录" : "未登录"}${p.plan ? ` · ${p.plan}` : ""}</small></div>
          ${full ? `<span class="lbl" style="color:var(--fg2);font-size:11px">Enabled</span><button class="switch${p.enabled ? " on" : ""}" data-en="${p.id}"></button>
                   <span class="lbl" style="color:var(--fg2);font-size:11px">Pinned</span><button class="switch${p.pinned ? " on" : ""}" data-pin="${p.id}" ${p.enabled ? "" : "disabled"}></button>` : ""}
        </div>`).join("");
      const logins = providers.map((p) => `
        <div class="adw-group">
          <h3>${p.name}</h3>
          <div class="adw-list">
            <div class="adw-row"><div class="t">Access token<small>${p.credentialSource === "pub" ? "已保存于 ~/.config/pub/credentials.json" : "留空则回退到官方 CLI 的登录"}</small></div><input type="password" placeholder="粘贴 token" value="${p.credentialSource === "pub" ? "••••••••••••" : ""}" /><button class="btn sug">保存</button><button class="btn">清除</button></div>
            ${p.id === "codex" ? `<div class="adw-row"><div class="t">Account ID</div><input placeholder="Codex account ID" /></div>` : ""}
            ${p.id === "cursor" ? `<div class="adw-row"><div class="t">User ID<small>可空</small></div><input placeholder="Cursor user ID" /></div>` : ""}
          </div>
        </div>`).join("");
      return `
        <div class="win">
          <div class="titlebar">PUB 设置<button class="close" data-act="prefs-close">✕</button></div>
          <div class="body">
            ${full ? `
              <div class="adw-group"><h3>Strip</h3><div class="adw-list">
                <div class="adw-row"><div class="t">百分比读法<small>Strip 与 Overview 同时生效</small></div>${modeSeg()}</div>
                <div class="adw-row"><div class="t">登录时启动</div><button class="switch${state.autostart ? " on" : ""}" data-act="autostart"></button></div>
              </div></div>
              <div class="adw-group"><h3>Provider</h3><p class="desc">拖动调整 Overview 与 Strip 的顺序。Enabled 才抓取；Pinned 才上 Strip。</p><div class="adw-list">${rows}</div></div>` : `
              <div class="adw-group"><h3>账号</h3><p class="desc">token 只写入 ~/.config/pub/credentials.json，不经过 DSH，也不必安装官方 CLI。</p></div>`}
            ${logins}
          </div>
        </div>`;
    }

    /* ===================== Variant A: List ===================== */
    function variantA() {
      const strip = ctrlBtn() + pinned().map((p) => `
        <button class="panel-btn${state.popover && state.page === "detail" && state.selected === p.id ? " on" : ""}" data-open="${p.id}" title="${p.name}">
          <span style="display:grid;${p.error ? "opacity:.55" : ""}">${icon(p.id, 16)}</span>
          <span class="num ${toneClass(p.remaining)}" style="font-weight:700;font-size:12.5px">${p.error ? "!" : pct(p.remaining)}</span>
        </button>`).join("");

      let body;
      if (state.page === "overview") {
        body = hdr("PUB", refreshBtn() + gearBtn("settings")) + `<div class="sep"></div>` +
          enabled().map((p) => {
            const w = primary(p);
            return `<button class="a-row${p.pinned ? "" : " unpinned"}" data-sel="${p.id}">
              <span class="ic">${icon(p.id, 18)}</span>
              <span class="name">${p.name}${w ? `<span class="win-l">${w.label}</span>` : ""}${p.pinned ? "" : `<span class="pill">未 Pin</span>`}</span>
              <span class="pct num ${toneClass(p.remaining)}">${p.error ? icon("warn", 16) : pct(p.remaining)}</span>
              ${p.error ? `<span class="err-row" style="grid-column:2 / span 2">${errText(p)}</span>` : `${bar(p.remaining, 5)}<span class="reset">${w?.resetLabel || ""}</span>`}
            </button>`;
          }).join("") +
          `<div class="sep"></div><div style="padding:8px 16px 10px;display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:11px">读法${modeSeg()}<span style="margin-left:auto">${pinned().length} / ${enabled().length} 在 Strip 上</span></div>`;
      } else if (state.page === "detail") {
        const p = providers.find((x) => x.id === state.selected) || providers[0];
        const w = primary(p);
        body = `<div class="hdr"><button class="ibtn" data-act="back">${icon("back", 16)}</button><h1 style="display:flex;align-items:center;gap:8px">${icon(p.id, 16)} ${p.name}${p.plan ? `<span class="pill">${p.plan}</span>` : ""}</h1><span class="stamp">${stamp()}</span>${refreshBtn()}</div>
          <div class="a-detail">
            ${p.error ? `<div class="err-row" style="padding:8px 0 12px;font-size:13px">${icon("warn", 16)} ${errText(p)}<span style="color:var(--fg2);margin-left:auto">${p.error === "HTTP 429" ? "稍后自动重试" : ""}</span></div>` :
              w ? `<div class="a-big"><span class="n num ${toneClass(w.remaining)}">${pct(w.remaining)}</span><span class="u">${modeWord()} · ${w.label}</span><span class="r">${w.resetLabel}</span></div>${bar(w.remaining, 8)}` : ""}
            <div style="margin-top:10px">
              ${p.windows.filter((x) => x !== w).map((x) => `<div class="a-win"><span class="l">${x.label}</span><span class="v num ${toneClass(x.remaining)}">${pct(x.remaining)} ${modeWord()}</span>${bar(x.remaining, 5)}<span class="m">${x.resetLabel || "—"}</span></div>`).join("")}
              ${p.extraNote ? `<div class="a-win"><span class="l">Extra usage</span><span class="v" style="color:var(--fg2)">${p.extraNote}</span></div>` : ""}
              ${p.cost?.month ? `<div class="a-win"><span class="l">Cost</span><span class="v" style="color:var(--fg2)">${p.cost.month}</span></div>` : ""}
            </div>
          </div>${footLinks(p)}`;
      } else if (state.page === "provider") {
        body = providerPageA();
      } else {
        body = `<div class="hdr"><button class="ibtn" data-act="back">${icon("back", 16)}</button><h1>设置</h1></div>
          <div class="a-row2"><span class="l">百分比读法<small>Strip 与 Overview 同时生效</small></span>${modeSeg()}</div>
          <div class="a-row2"><span class="l">登录时启动</span><button class="switch${state.autostart ? " on" : ""}" data-act="autostart"></button></div>
          <div class="sep" style="margin:4px 16px 6px"></div>
          <div class="a-group">PROVIDER · 拖动调整顺序</div>
          ${providers.map((p, i) => `<div class="a-prow${p.enabled ? "" : " off"}" data-prov="${p.id}" draggable="true" data-idx="${i}">
              <span class="ic" style="display:grid">${icon(p.id, 18)}</span>
              <span><span class="nm">${p.name}</span><span class="st${p.error && p.enabled ? " bad" : ""}" style="display:block">${loginStatus(p)}</span></span>
              <button class="pinb${p.pinned ? " on" : ""}" data-pin="${p.id}" title="${p.pinned ? "从 Strip 移除" : "固定到 Strip"}" ${p.enabled ? "" : "disabled"}>${icon("pin", 16)}</button>
              <span class="grip" title="拖动排序">⋮⋮</span>
            </div>`).join("")}
          <div style="padding:6px 16px 10px;color:var(--fg3);font-size:11px">${pinned().length} 个在 Strip 上 · 点行进入该 Provider 的登录与显示设置</div>`;
      }
      return panelShell(strip, `<div class="pop a-pop">${body}</div>`);
    }

    function loginStatus(p) {
      if (!p.enabled) return "已停用 · 不抓取";
      if (p.error === "signed out" || (!p.credentialSource && p.remaining == null)) return "未登录";
      const via = p.credentialSource === "cli" ? `通过 ${LOGIN[p.id]?.cli || "官方 CLI"}` : "PUB 保存的凭据";
      const plan = p.plan ? ` · ${p.plan}` : "";
      if (p.error) return `已登录 · ${via}${plan} · 抓取失败 ${p.error}`;
      return `已登录 · ${via}${plan}`;
    }
    function providerPageA() {
      const p = providers.find((x) => x.id === state.selected) || providers[0];
      const L = LOGIN[p.id];
      const lg = state.login && state.login.id === p.id ? state.login : null;
      const signedIn = !!p.credentialSource && p.error !== "signed out";
      let loginCard;
      if (lg && lg.phase === "waiting") {
        loginCard = `<div class="a-card"><div class="t">${icon(p.id, 16)} 正在浏览器中登录</div>
          <div class="d">${L.kind === "cli" ? `已通过 ${L.cli} 打开授权页面。完成授权后会自动写入 ${L.file}，PUB 随即读取。` : `已打开 ${L.page}。`}</div>
          <div class="acts"><span class="wait"><span class="dot"></span>等待授权…</span><span style="flex:1"></span><button class="btn quiet" data-act="login-cancel">取消</button></div></div>`;
      } else if (lg && lg.phase === "paste") {
        loginCard = `<div class="a-card"><div class="t">粘贴凭据</div>
          <div class="d">${L.kind === "cookie" ? "在浏览器登录 cursor.com 后，从开发者工具复制 cookie。" : L.kind === "key" ? "在 ollama.com 创建一个 API key 并粘贴。" : `手动方式。通常不需要，${L.cli} 登录后 PUB 会自动读取。`}</div>
          <div class="acts"><input class="a-entry" type="password" placeholder="${L.hint}" />${L.extra ? `<input class="a-entry" placeholder="${L.extra}" />` : ""}</div>
          <div class="acts"><button class="btn sug" data-act="login-save">保存</button><button class="btn quiet" data-act="login-cancel">取消</button></div></div>`;
      } else {
        const status = signedIn
          ? `<div class="t">${icon(p.id, 16)} 已登录${p.plan ? `<span class="pill">${p.plan}</span>` : ""}</div><div class="d">${p.credentialSource === "cli" ? `凭据来自 ${L.cli}（${L.file}）。` : "凭据由 PUB 保存在 ~/.config/pub/credentials.json，权限 600。"}${p.error ? ` <span style="color:var(--crit)">上次抓取失败：${p.error}。</span>` : ""}</div>`
          : `<div class="t">${icon(p.id, 16)} 未登录</div><div class="d">${L.kind === "cli" ? `${L.cli} 会打开浏览器完成授权，PUB 只读取它写下的凭据，不需要你复制任何 token。` : L.kind === "cookie" ? "Cursor 没有公开的授权接口，需要从已登录的浏览器复制 cookie。" : "Ollama Cloud 用 API key，在网页里创建后粘贴即可。"}</div>`;
        const primaryBtn = L.kind === "cli"
          ? `<button class="btn sug" data-act="login-browser">在浏览器中登录 ↗</button>`
          : `<button class="btn sug" data-act="login-open">打开 ${L.kind === "cookie" ? "cursor.com" : "ollama.com"} ↗</button>`;
        loginCard = `<div class="a-card">${status}<div class="acts">
          ${signedIn ? `<button class="btn" data-act="login-out">退出登录</button>` : primaryBtn}
          <button class="btn quiet" data-act="login-paste">${signedIn ? "换一个凭据…" : "手动粘贴…"}</button></div></div>`;
      }
      const wins = p.windows.length ? p.windows : [{ id: "primary", label: "（登录后显示）", primary: true }];
      return `<div class="hdr"><button class="ibtn" data-act="back-settings">${icon("back", 16)}</button><h1 style="display:flex;align-items:center;gap:8px">${p.name}</h1></div>
        ${loginCard}
        <div class="a-group">显示</div>
        <div class="a-row2"><span class="l">监视此 Provider<small>关闭后不再抓取，也不出现在 Overview</small></span><button class="switch${p.enabled ? " on" : ""}" data-en="${p.id}"></button></div>
        <div class="a-row2"><span class="l">固定到 Strip</span><button class="switch${p.pinned ? " on" : ""}" data-pin="${p.id}" ${p.enabled ? "" : "disabled"}></button></div>
        <div class="a-group" style="padding-top:8px">PRIMARY WINDOW · Strip 与 Overview 显示这一项</div>
        ${wins.map((w) => `<div class="a-row2 pick" data-primary="${p.id}:${w.id}"><span class="radio${w.primary ? " on" : ""}"></span><span class="l">${w.label}${w.resetLabel ? `<small>${w.resetLabel}</small>` : ""}</span>${w.remaining != null ? `<span class="num ${toneClass(w.remaining)}" style="font-weight:600">${pct(w.remaining)}</span>` : ""}</div>`).join("")}
        <div class="sep" style="margin-top:6px"></div>
        <button class="link-row" data-url="${p.usageUrl}">打开 ${p.name} 用量页<span class="go">↗</span></button>`;
    }

    /* ===================== Variant B: Board ===================== */
    function variantB() {
      const strip = ctrlBtn() + pinned().map((p) => `
        <button class="panel-btn b-meter" data-hover="${p.id}" title="" style="${p.error ? "opacity:.6" : ""}">
          <span class="ic">${icon(p.id, 16)}</span>
          <span class="ln"><span style="width:${frac(p.remaining) * 100}%;background:${p.error ? "transparent" : toneOf(p.remaining) === "ok" ? "#fff" : toneColor(p.remaining)}"></span></span>
        </button>`).join("");
      const hov = state.hover && providers.find((p) => p.id === state.hover);
      const tip = hov ? `<div class="b-tip" style="right:${60 + 32 * (pinned().length - pinned().indexOf(hov) - 1)}px">${hov.name} · ${hov.error ? errText(hov) : `${pct(hov.remaining)} ${modeWord()} · ${primary(hov)?.resetLabel || ""}`}</div>` : "";

      const cards = enabled().map((p) => {
        const w = primary(p);
        return `<div class="b-card${p.pinned ? "" : " unpinned"}" style="border-left-color:${p.error ? "var(--crit)" : accentOf(p)}">
          <div class="top">
            <span style="display:grid">${icon(p.id, 18)}</span>
            <span class="nm">${p.name}${p.plan ? `<span class="pill">${p.plan}</span>` : ""}${p.pinned ? "" : `<span class="pill">未 Pin</span>`}<span class="stamp" style="margin-left:auto;padding-right:8px">${w?.resetLabel || ""}</span></span>
            <span class="pct num ${toneClass(p.remaining)}">${p.error ? icon("warn", 18) : pct(p.remaining)}</span>
          </div>
          ${p.error ? `<div class="err-row" style="margin-top:6px">${errText(p)} · <a href="#" data-url="${p.usageUrl}" style="color:inherit">打开用量页</a></div>` : `
          <div class="b-wins">
            ${p.windows.map((x) => `<span class="l${x.primary ? " pri" : ""}">${x.label}</span>${bar(x.remaining, 5, x.primary ? accentOf(p) === "var(--accent)" ? toneColor(x.remaining) : toneOf(x.remaining) === "ok" ? accentOf(p) : toneColor(x.remaining) : toneColor(x.remaining, "var(--fg3)"))}<span class="v num ${toneClass(x.remaining)}">${pct(x.remaining)}</span><span class="r">${x.resetLabel || "—"}</span>`).join("")}
          </div>
          ${p.extraNote || p.cost?.month ? `<div class="b-extra">${p.extraNote ? `<span>Extra usage: ${p.extraNote}</span>` : ""}${p.cost?.month ? `<span>Cost: ${p.cost.month}</span>` : ""}</div>` : ""}`}
        </div>`;
      }).join("");
      const body = hdr("Plan Quota", refreshBtn()) +
        `<div class="b-body">${cards}</div>
         <div class="sep"></div>
         <div class="b-foot">${modeSeg()}<span class="grow"></span><button class="link-row" data-act="prefs" style="width:auto;padding:6px 10px;border-radius:8px">${icon("gear", 15)} 设置</button></div>`;
      return panelShell(strip, `<div class="pop b-pop">${body}</div>${tip}`);
    }

    /* ===================== Variant C: Ring ===================== */
    function variantC() {
      const strip = ctrlBtn() + pinned().map((p) => `
        <button class="panel-btn c-meter${state.popover && state.selected === p.id ? " on" : ""}" data-open="${p.id}" title="${p.name}">
          <span style="position:relative;width:18px;height:18px;display:grid;place-items:center">
            ${p.error ? `<span style="color:var(--crit);display:grid">${icon("warn", 14)}</span>` : ring(p.remaining, 18, 3, toneOf(p.remaining) === "ok" ? "#fff" : toneColor(p.remaining))}
          </span>
          <span class="num ${toneClass(p.remaining)}" style="font-weight:700;font-size:12px">${p.error ? "" : pct(p.remaining)}</span>
        </button>`).join("");

      const list = state.edit ? providers : enabled();
      const tiles = list.map((p, i) => {
        const w = primary(p);
        const on = !state.edit && state.selected === p.id;
        const tag = state.edit ? "div" : "button";
        const rs = state.edit ? 44 : 56;
        return `<${tag} class="c-tile${on ? " on" : ""}${p.pinned ? "" : " unpinned"}${state.edit ? " editing" : ""}" data-sel="${p.id}">
          <span class="ring">${ring(p.remaining, rs, 5, toneOf(p.remaining) === "ok" ? accentOf(p) : undefined)}<span class="ic">${p.error ? `<span style="color:var(--crit);display:grid">${icon("warn", 20)}</span>` : icon(p.id, 20)}</span></span>
          <span>
            <span class="nm">${p.name}</span>
            <span class="pct num ${toneClass(p.remaining)}" style="display:block">${p.error ? "—" : pct(p.remaining)}</span>
            <span class="sub" style="display:block">${p.error ? errText(p) : `${w?.label || ""} · ${w?.resetLabel || modeWord()}`}</span>
          </span>
          ${state.edit ? `<span class="ctl"><button class="switch${p.pinned ? " on" : ""}" data-pin="${p.id}" ${p.enabled ? "" : "disabled"}></button>
            <span class="edit-ord"><span data-mv="${i}:-1">↑</span><span data-mv="${i}:1">↓</span></span></span>` : ""}
        </${tag}>` + (on ? detailC(p) : "");
      }).join("");

      const body = hdr("PUB", (state.edit ? "" : refreshBtn()) + `<button class="ibtn${state.edit ? " on" : ""}" data-act="edit" title="编辑" style="${state.edit ? "width:auto;padding:0 12px;font-size:12px;font-weight:700" : ""}">${state.edit ? "完成" : icon("gear", 16)}</button>`) +
        (state.edit ? `<div style="padding:0 14px 8px;display:flex;align-items:center;gap:10px;color:var(--fg2);font-size:11px">读法${modeSeg()}<span style="margin-left:auto">开关 = Pinned；↑↓ 调 Strip 与网格顺序</span></div>` : "") +
        `<div class="c-grid">${tiles}</div>` +
        (state.edit ? `<div class="sep"></div><button class="link-row" data-act="prefs">Enabled 与账号登录…<span class="go">↗ 设置窗口</span></button>` : "");
      return panelShell(strip, `<div class="pop c-pop">${body}</div>`);
    }
    function detailC(p) {
      const w = primary(p);
      return `<div class="c-detail">
        <div class="head"><span class="nm">${p.name}${p.plan ? ` <span class="pill">${p.plan}</span>` : ""}</span><span class="stamp" style="color:var(--fg2);font-size:11px">${stamp()}</span></div>
        ${p.error ? `<div class="err-row">${icon("warn", 16)} ${errText(p)}</div>` : `<div class="wins">
          ${p.windows.map((x) => `<div class="c-win" style="${x.primary ? "box-shadow:inset 0 0 0 1px var(--sep)" : ""}">
            <span style="position:relative;display:grid;place-items:center">${ring(x.remaining, 44, 4)}<span class="num ${toneClass(x.remaining)}" style="position:absolute;font-weight:700;font-size:11px">${pct(x.remaining)}</span></span>
            <span class="l">${x.label}${x.primary ? " ★" : ""}</span><span class="r">${x.resetLabel || "—"}</span></div>`).join("")}
          ${p.extraNote ? `<div class="c-win"><span class="l">Extra</span><span class="r">${p.extraNote}</span></div>` : ""}
          ${p.cost?.month ? `<div class="c-win"><span class="l">Cost</span><span class="r">${p.cost.month}</span></div>` : ""}
        </div>`}
        <div class="c-links"><button data-url="${p.usageUrl}">用量页 ↗</button><button data-url="${p.statusUrl}">状态页 ↗</button></div>
      </div>`;
    }

    /* ---------- render / wire ---------- */
    const app = document.getElementById("app");
    function render() {
      document.body.className = state.theme;
      app.innerHTML = { A: variantA, B: variantB, C: variantC }[state.variant]();
      document.getElementById("switchLabel").textContent = `${state.variant} (${VARIANTS[state.variant].name})`;
      document.getElementById("explain").innerHTML = `<b>${state.variant} · ${VARIANTS[state.variant].name}</b>${VARIANTS[state.variant].why}`;
      document.getElementById("bTheme").textContent = state.theme;
      document.getElementById("bMode").textContent = state.remainingMode ? "Remaining" : "Used";
      const { hover, ...rest } = state;
      document.getElementById("stateDump").textContent = JSON.stringify({ ...rest, order: providers.map((p) => `${p.id}${p.pinned ? "*" : ""}${p.enabled ? "" : "(off)"}`) }, null, 1);
      const ctx = document.getElementById("ctx");
      ctx.classList.toggle("open", !!state.ctx);
      if (state.ctx) { ctx.style.left = `${state.ctx.x}px`; ctx.style.top = `${state.ctx.y}px`; }
    }
    function moveProvider(i, d) {
      const j = i + d; if (j < 0 || j >= providers.length) return;
      const [row] = providers.splice(i, 1); providers.splice(j, 0, row);
    }
    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-ctrl],[data-open],[data-sel],[data-act],[data-mode],[data-en],[data-pin],[data-mv],[data-url],[data-b],[data-primary],[data-prov]");
      const inCtx = e.target.closest("#ctx");
      if (!inCtx) state.ctx = null;
      if (!t) { if (!e.target.closest(".pop,.win,.badge,.switcher,.panel")) state.popover = false; render(); return; }
      const d = t.dataset;
      if (d.b) {
        if (d.b === "theme") state.theme = state.theme === "dark" ? "light" : "dark";
        if (d.b === "mode") state.remainingMode = !state.remainingMode;
        if (d.b === "refresh") { state.refreshing = true; setTimeout(() => { state.refreshing = false; render(); }, 1800); }
        if (d.b === "pop") state.popover = !state.popover;
        if (d.b === "claude") { state.claudeOk = !state.claudeOk; Object.assign(providers.find((p) => p.id === "claude"), state.claudeOk ? CLAUDE_OK : { remaining: null, plan: undefined, error: "HTTP 429", windows: [] }); }
        if (d.b === "cursor") { state.cursorDrained = !state.cursorDrained; const c = providers.find((p) => p.id === "cursor"); if (state.cursorDrained) { c.remaining = 0.03; c.windows[0].remaining = 0.03; } else { c.remaining = CURSOR_ORIG.remaining; c.windows[0].remaining = CURSOR_ORIG.windows[0].remaining; } }
      }
      if (d.ctrl) { state.popover = !state.popover; if (state.popover && state.variant === "A") state.page = "overview"; }
      if (d.open) { state.selected = d.open; if (state.variant === "A") state.page = "detail"; state.popover = !(state.popover && state.variant === "C" && state.selected === d.open && false); state.popover = true; }
      if (d.sel) {
        if (state.variant === "A") { state.selected = d.sel; state.page = "detail"; }
        else if (state.variant === "C" && !state.edit) state.selected = state.selected === d.sel ? null : d.sel;
      }
      if (d.act) {
        if (d.act === "refresh") { state.refreshing = true; setTimeout(() => { state.refreshing = false; render(); }, 1800); }
        if (d.act === "back") state.page = "overview";
        if (d.act === "back-settings") { state.page = "settings"; state.login = null; }
        if (d.act === "login-browser" || d.act === "login-open") {
          state.login = { id: state.selected, phase: "waiting" };
          if (d.act === "login-open") { state.login.phase = "paste"; }
          else setTimeout(() => {
            if (!state.login || state.login.phase !== "waiting") return;
            const p = providers.find((x) => x.id === state.login.id);
            p.credentialSource = "cli"; p.error = undefined;
            if (p.id === "claude") { Object.assign(p, CLAUDE_OK); state.claudeOk = true; }
            state.login = null; render();
          }, 2500);
        }
        if (d.act === "login-paste") state.login = { id: state.selected, phase: "paste" };
        if (d.act === "login-cancel") state.login = null;
        if (d.act === "login-save") { const p = providers.find((x) => x.id === state.selected); p.credentialSource = "pub"; p.error = undefined; if (p.id === "claude") { Object.assign(p, CLAUDE_OK); state.claudeOk = true; } state.login = null; }
        if (d.act === "login-out") { const p = providers.find((x) => x.id === state.selected); p.credentialSource = undefined; p.error = "signed out"; p.remaining = null; p.windows = []; p.plan = undefined; }
        if (d.act === "settings") { state.popover = true; state.page = "settings"; }
        if (d.act === "edit") state.edit = !state.edit;
        if (d.act === "prefs") state.prefs = true;
        if (d.act === "prefs-close") state.prefs = false;
        if (d.act === "autostart") state.autostart = !state.autostart;
        if (d.act === "exit") { state.exited = true; state.popover = false; }
      }
      if (d.mode) state.remainingMode = d.mode === "1";
      if (d.en) { const p = providers.find((x) => x.id === d.en); p.enabled = !p.enabled; if (!p.enabled) p.pinned = false; }
      if (d.pin) { const p = providers.find((x) => x.id === d.pin); if (p.enabled) p.pinned = !p.pinned; }
      if (d.primary) { const [pid, wid] = d.primary.split(":"); const p = providers.find((x) => x.id === pid); for (const w of p.windows) w.primary = w.id === wid; const pw = p.windows.find((w) => w.primary); if (pw) p.remaining = pw.remaining; }
      if (d.prov && !e.target.closest("[data-pin],.grip")) { state.selected = d.prov; state.page = "provider"; state.login = null; }
      if (d.mv) { const [i, dd] = d.mv.split(":").map(Number); moveProvider(i, dd); }
      if (d.url) { e.preventDefault(); alert(`xdg-open ${d.url}`); }
      render();
    });
    document.addEventListener("contextmenu", (e) => {
      const c = e.target.closest("[data-ctrl]");
      if (!c) return;
      e.preventDefault();
      state.popover = false;
      state.ctx = { x: Math.min(e.clientX, innerWidth - 200), y: 36 };
      render();
    });
    document.addEventListener("mouseover", (e) => {
      if (state.variant !== "B") return;
      const m = e.target.closest("[data-hover]");
      const next = m ? m.dataset.hover : null;
      if (next !== state.hover) { state.hover = next; render(); }
    });

    document.addEventListener("dragstart", (e) => {
      const r = e.target.closest("[data-prov]"); if (!r) return;
      state.drag = Number(r.dataset.idx); r.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
    });
    document.addEventListener("dragover", (e) => {
      const r = e.target.closest("[data-prov]"); if (!r || state.drag === null) return;
      e.preventDefault(); document.querySelectorAll(".a-prow.over").forEach((x) => x.classList.remove("over")); r.classList.add("over");
    });
    document.addEventListener("drop", (e) => {
      const r = e.target.closest("[data-prov]"); if (!r || state.drag === null) return;
      e.preventDefault(); const to = Number(r.dataset.idx); const [row] = providers.splice(state.drag, 1); providers.splice(to, 0, row); state.drag = null; render();
    });
    document.addEventListener("dragend", () => { state.drag = null; render(); });

    /* switcher */
    const keys = Object.keys(VARIANTS);
    function setVariant(v) {
      state.variant = v; state.page = "overview"; state.edit = false; state.prefs = false;
      const url = new URL(location.href); url.searchParams.set("variant", v); history.replaceState(null, "", url);
      render();
    }
    document.getElementById("prev").onclick = () => setVariant(keys[(keys.indexOf(state.variant) + keys.length - 1) % keys.length]);
    document.getElementById("next").onclick = () => setVariant(keys[(keys.indexOf(state.variant) + 1) % keys.length]);
    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input,textarea,[contenteditable]")) return;
      if (e.key === "ArrowLeft") document.getElementById("prev").click();
      if (e.key === "ArrowRight") document.getElementById("next").click();
      if (e.key === "Escape") { state.ctx = null; state.prefs = false; render(); }
    });
    const initial = new URL(location.href).searchParams.get("variant");
    setVariant(keys.includes(initial) ? initial : "A");
    /* ?s=page:detail,theme:light,prefs:1,edit:1,selected:cursor,mode:used — deep-link a state for screenshots */
    const deep = new URL(location.href).searchParams.get("s");
    if (deep) {
      for (const kv of deep.split(",")) {
        const [k, v] = kv.split(":");
        if (k === "page") state.page = v;
        if (k === "theme") state.theme = v;
        if (k === "prefs") state.prefs = v === "1";
        if (k === "edit") state.edit = v === "1";
        if (k === "selected") state.selected = v;
        if (k === "login") state.login = { id: state.selected, phase: v };
        if (k === "signedout") { const p = providers.find((x) => x.id === v); p.credentialSource = undefined; p.error = "signed out"; p.remaining = null; p.windows = []; p.plan = undefined; }
        if (k === "mode") state.remainingMode = v !== "used";
        if (k === "pop") state.popover = v === "1";
        if (k === "ctx") state.ctx = { x: innerWidth - 300, y: 36 };
      }
      render();
    }
  </script>
</body>
</html>
