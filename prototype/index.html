<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUB prototype (throwaway)</title>
  <!--
    Three variants of the PUB GNOME strip + popover, switchable via ?variant=,
    answering: can this look as good as the CodexBar macOS screenshot inside a GNOME extension?
  -->
  <style>
    :root { --panel: 36px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Inter, "SF Pro Text", "Ubuntu", system-ui, sans-serif;
      overflow: hidden;
      background: #1a1430;
    }
    .wallpaper {
      position: fixed; inset: 0;
      background:
        radial-gradient(1200px 700px at 70% 10%, #c9a8ff 0%, transparent 50%),
        radial-gradient(900px 600px at 10% 80%, #7aa2ff 0%, transparent 45%),
        linear-gradient(160deg, #5b4b8a 0%, #7d6aa8 40%, #8ec5ff 100%);
    }
    .prototype-badge {
      position: fixed; top: 48px; left: 12px; z-index: 40;
      font: 11px/1.35 ui-monospace, monospace;
      color: #fff; background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px; padding: 8px 10px; max-width: 340px;
      white-space: pre-wrap;
      pointer-events: none;
    }
    .ctx-menu {
      position: fixed; z-index: 30; min-width: 188px;
      background: rgba(28,28,30,.92); color: #f2f2f7;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: 6px 0;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
      display: none;
    }
    .ctx-menu.open { display: block; }
    .ctx-menu button {
      display: block; width: 100%; text-align: left;
      background: none; border: 0; color: inherit;
      font: 13px/32px Inter, sans-serif; padding: 0 14px; cursor: pointer;
    }
    .ctx-menu button:hover { background: rgba(255,255,255,.08); }
    .ctx-menu .sep { height: 1px; background: rgba(255,255,255,.12); margin: 5px 0; }

    /* ===== switcher (not part of the design) ===== */
    .switcher {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 10px;
      background: #111; color: #fff; border: 2px solid #fff;
      border-radius: 999px; padding: 8px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
      font: 13px/1 Inter, sans-serif; user-select: none;
    }
    .switcher button {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid #fff; background: #000; color: #fff; cursor: pointer;
    }
    .switcher .label { min-width: 280px; text-align: center; }

    /* shared tiny bits */
    .bar-track { height: 6px; border-radius: 99px; background: rgba(120,120,140,.22); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; display: block; }
    .warn { color: #c2410c; }
    .crit { color: #b91c1c; }
    .ok { color: #16a34a; }

    /* Variant A — frosted instrument strip + icon-rail popover */
    .a-strip {
      display: flex; align-items: stretch; gap: 0; height: 28px; padding: 2px;
      margin-right: 12px; border-radius: 9px;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px rgba(255,255,255,.1);
    }
    .a-ctrl {
      width: 24px; border: 0; border-radius: 7px; cursor: pointer;
      color: rgba(255,255,255,.92); display: grid; place-items: center; background: transparent;
    }
    .a-ctrl:hover { background: rgba(255,255,255,.1); }
    .a-ctrl.on { background: rgba(255,255,255,.2); }
    .a-split { width: 1px; margin: 5px 3px; background: rgba(255,255,255,.18); flex: none; }
    .a-chip {
      display: grid; grid-template-rows: 14px 2px; align-items: center; justify-items: stretch;
      gap: 3px; min-width: 0; padding: 3px 7px 4px; border: 0; cursor: pointer;
      border-radius: 7px; color: #fff; background: transparent;
    }
    .a-chip:hover { background: rgba(255,255,255,.1); }
    .a-chip.on { background: rgba(255,255,255,.2); }
    .a-chip-row { display: flex; align-items: center; gap: 4px; justify-content: center; height: 14px; }
    .a-chip-row svg { width: 12px; height: 12px; display: block; flex: none; }
    .a-chip .pct {
      font: 600 10px/1 "SF Pro Text", Inter, sans-serif;
      font-variant-numeric: tabular-nums; letter-spacing: .04em; opacity: .95;
    }
    .a-chip .mini { display: block; height: 2px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
    .a-pop {
      position: absolute; top: 8px; right: 72px; width: 420px;
      display: grid; grid-template-columns: 64px 1fr; align-items: stretch;
      background: linear-gradient(180deg, rgba(252,252,255,.84), rgba(236,236,248,.76));
      border: 1px solid rgba(255,255,255,.72); border-radius: 18px;
      box-shadow: 0 24px 64px rgba(40,20,80,.28), 0 1px 0 rgba(255,255,255,.55) inset;
      backdrop-filter: blur(36px) saturate(1.45); overflow: hidden;
    }
    .a-tabs {
      display: flex; flex-direction: column; gap: 2px; padding: 8px 6px 10px;
      background: rgba(255,255,255,.28);
      border-right: 1px solid rgba(60,60,80,.08);
    }
    .a-tab {
      display: grid; grid-template-rows: 20px 3px 11px; justify-items: center; align-items: center;
      width: 100%; box-sizing: border-box; border: 0; background: transparent; cursor: pointer;
      padding: 7px 4px 6px; gap: 4px; border-radius: 12px; color: #3a3a48;
    }
    .a-tab:hover { background: rgba(40,40,55,.10); }
    .a-tab.on, .a-tab.on:hover { background: #3b6cff; color: #fff; box-shadow: 0 6px 14px rgba(59,108,255,.26); }
    .a-tab.on:hover { background: #2f5ef0; }
    .a-tab .ico { width: 20px; height: 20px; display: grid; place-items: center; }
    .a-tab .ico svg { width: 18px; height: 18px; display: block; }
    .a-tab .mini {
      display: block; width: 22px; height: 3px;
      border-radius: 99px; overflow: hidden; background: rgba(40,40,55,.2);
    }
    .a-tab.on .mini { background: rgba(255,255,255,.35); }
    .a-tab .pct {
      display: block; width: auto; text-align: center;
      font: 650 10px/1 "SF Pro Text", Inter, sans-serif;
      font-variant-numeric: tabular-nums; letter-spacing: .02em; opacity: .72;
    }
    .a-tab.on .pct { opacity: .95; }
    .a-detail { padding: 16px 20px 8px; overflow: visible; }
    .a-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .a-head h2 { margin: 0; font: 650 22px/1.1 "SF Pro Display", Inter, sans-serif; color: #1a1a24; letter-spacing: -.02em; }
    .a-head .sub { margin-top: 4px; font: 12.5px/1.3 Inter, sans-serif; color: #7a7a8c; }
    .a-head .plan { font: 13px Inter, sans-serif; color: #8a8a9a; padding-top: 4px; }
    .a-win { margin: 0 0 14px; }
    .a-win h4 { margin: 0; font: 650 13.5px/1.2 "SF Pro Text", Inter, sans-serif; color: #1c1c28; }
    .a-win .bar { height: 5px; margin: 7px 0 5px; border-radius: 99px; background: rgba(120,120,140,.16); overflow: hidden; }
    .a-win .meta { display: flex; justify-content: space-between; gap: 8px; font: 12px/1.3 Inter, sans-serif; color: #6e6e80; }
    .a-win .pace { margin-top: 3px; font: 11.5px Inter, sans-serif; color: #8a8a9c; }
    .a-block { margin: 4px 0 12px; }
    .a-block h4 { margin: 0 0 6px; font: 650 13.5px Inter, sans-serif; color: #1c1c28; }
    .a-block .row { display: flex; justify-content: space-between; gap: 8px; font: 12.5px Inter, sans-serif; color: #5c5c70; }
    .a-cost { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 4px; }
    .a-cost h4 { margin: 0; }
    .a-cost .chev { opacity: .35; font-size: 16px; line-height: 1; }
    .a-lines { margin: 0; padding: 0; list-style: none; font: 12.5px/1.55 Inter, sans-serif; color: #5c5c70; }
    .a-foot { margin: 8px -20px 0; padding: 8px 20px 12px; border-top: 1px solid rgba(60,60,80,.1); }
    .a-link {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 6px 0; border: 0; background: none; cursor: pointer; text-align: left;
      font: 13.5px Inter, sans-serif; color: #2a2a38; text-decoration: none;
    }
    a.a-link { color: #2a2a38; }
    .a-link:hover { color: #111; }
    .a-link svg { width: 15px; height: 15px; opacity: .7; flex: none; }
    .a-link .go { margin-left: auto; opacity: .35; font-size: 13px; }
    .a-foot-note { margin: 8px 0 0; font: 11.5px/1.4 Inter, sans-serif; color: #8a8a9c; }
    .a-quiet { margin: 6px 0 0; padding-top: 6px; border-top: 1px solid rgba(60,60,80,.08); }
  </style>
</head>

      if (id === "grok") {

    function hubMark(size) {
      const s = size || 14;
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7.25" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="2.15" fill="currentColor"/>
        <circle cx="12" cy="3.6" r="1.85" fill="currentColor"/>
        <circle cx="20.4" cy="12" r="1.85" fill="currentColor"/>
        <circle cx="12" cy="20.4" r="1.85" fill="currentColor"/>
        <circle cx="3.6" cy="12" r="1.85" fill="currentColor"/>
      </svg>`;
    }
    function barFill(p) {
      const t = tone(p.remaining);
      if (t === "crit") return "#ef4444";
      if (t === "warn") return "#f97316";
      return p.accent === "#111111" || p.accent === "#111" ? "#93c5fd" : p.accent;
    }
    function shownWidth(rem) {
      if (rem == null) return 0;
      return (state.remainingMode ? rem : 1 - rem) * 100;
    }
    function usedLabel(rem) {
      if (rem == null) return "No percent in API";
      const n = pctNumber(rem);
      return state.remainingMode ? `${n}% left` : `${n}% used`;
    }
    function ico(p, size, on) {
      const color = on ? "currentColor" : p.accent;
      return `<span class="ico" style="color:${color}">${mark(p.id, size)}</span>`;
    }
    function pinned() { return PROVIDERS.filter((p) => p.pinned); }
    function selected() { return PROVIDERS.find((p) => p.id === state.selected) || PROVIDERS[0]; }

    function gnomeClock() {
      return `<div style="margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:10px;opacity:.95">
        <span>00:12</span>
        <span style="opacity:.7">●</span>
      </div>`;
    }

    /* ---------- Variant A: inset chips + CodexBar hang popover ---------- */
    function variantA() {
      const sel = selected();
      const meters = pinned().map((p, i) => {
        const on = state.popover && state.selected === p.id;
        return `${i ? `<span class="a-split"></span>` : ""}<button class="a-chip${on ? " on" : ""}" data-open="${p.id}">
          <span class="a-chip-row">${mark(p.id, 12)}<span class="pct">${displayPct(p.remaining)}</span></span>
          <span class="mini"><span class="bar-fill" style="width:${shownWidth(p.remaining)}%;background:${barFill(p)}"></span></span>
        </button>`;
      }).join("");
      const tabs = PROVIDERS.map((p) => {
        const on = state.selected === p.id;
        return `<button class="a-tab pick${on ? " on" : ""}" data-id="${p.id}">
          ${ico(p, 18, on)}
          <span class="mini"><span class="bar-fill" style="width:${shownWidth(p.remaining)}%;background:${on ? "#fff" : barFill(p)}"></span></span>
          <span class="pct">${displayPct(p.remaining)}</span>
        </button>`;
      }).join("");
      const windows = sel.windows.map((w) => `
        <div class="a-win">
          <h4>${w.label}</h4>
          <div class="bar"><span class="bar-fill" style="width:${shownWidth(w.remaining)}%;background:${fillColor(w.remaining)}"></span></div>
          <div class="meta"><span>${usedLabel(w.remaining)}</span><span>${w.reset || ""}</span></div>
          ${w.pace ? `<div class="pace">${w.pace}</div>` : ""}
        </div>`).join("");
      const extraBlock = sel.extra != null && sel.extraPct != null ? `
          <div class="a-block">
            <h4>Extra usage</h4>
            <div class="row"><span>This month: ${sel.extra}</span><span>${Math.round(sel.extraPct * 100)}% used</span></div>
            <div class="a-win"><div class="bar" style="margin-top:7px"><span class="bar-fill" style="width:${Math.round(sel.extraPct * 100)}%;background:${sel.extraPct > 0.8 ? "#ef4444" : "#3b82f6"}"></span></div></div>
          </div>` : (sel.extraNote ? `
          <div class="a-block">
            <h4>Extra usage</h4>
            <div class="row"><span>${sel.extraNote}</span></div>
          </div>` : "");
      const costBlock = (sel.costToday || sel.costMonth) ? `
          <div class="a-block">
            <div class="a-cost"><h4>Cost</h4></div>
            <ul class="a-lines">
              ${sel.costToday ? `<li>Today: ${sel.costToday}</li>` : ""}
              ${sel.costMonth ? `<li>${sel.costMonth}</li>` : ""}
            </ul>
          </div>` : "";
      const noteBlock = sel.note ? `<p class="a-foot-note" style="margin:0 0 10px">${sel.note}</p>` : "";
      const detail = `
        <section class="a-detail">
          <div class="a-head">
            <div>
              <h2>${sel.name}</h2>
              <div class="sub">${sel.fetched || "Updated just now"}</div>
            </div>
            <div class="plan">${sel.plan}</div>
          </div>
          ${windows}
          ${noteBlock}
          ${extraBlock}
          ${costBlock}
          <div class="a-foot">
            <a class="a-link" href="${sel.usageUrl}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 18V8h2.5v10zm6.75 0V4h2.5v14zm6.75 0v-7H20v7z"/></svg>
              打开 ${sel.name} 用量页
              <span class="go">↗</span>
            </a>
            <a class="a-link" href="${sel.statusUrl}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm1 5h-2v6h6v-2h-4z"/></svg>
              打开状态页
              <span class="go">↗</span>
            </a>
            <p class="a-foot-note">外链进该 Provider 官网。账号只读本机已有登录，v1 不在这里添加。</p>
            <div class="a-quiet">
              <button class="a-link" type="button" data-settings="1">设置…</button>
            </div>
          </div>
        </section>`;
      const body = `<aside class="a-tabs">${tabs}</aside>${state.view === "settings" ? settingsBody("A") : detail}`;

      return `
        <div style="height:100%;display:flex;flex-direction:column">
          <div class="a-panel" style="height:var(--panel);display:flex;align-items:center;padding:0 8px 0 12px;
            background:rgba(20,18,28,.78);color:#fff;backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)">
            <span style="font:600 13px Inter,sans-serif;opacity:.85">Activities</span>
            <div style="flex:1"></div>
            ${state.exited ? "" : `
            <div class="a-strip">
              <button class="a-ctrl${state.popover ? " on" : ""}" data-ctrl="1" title="PUB">
                ${hubMark(14)}
              </button>
              <span class="a-split"></span>
              ${meters}
            </div>`}
            ${gnomeClock()}
          </div>
          <div style="flex:1;position:relative">
            ${state.popover && !state.exited ? `<div class="a-pop">${body}</div>` : `<div style="padding:80px 40px;color:#fff;font:18px Inter,sans-serif;opacity:.85">
              ${state.exited ? "已退出。用底部切换器或刷新重新打开原型。" : "点 Strip 打开 Popover。右键总标打开菜单。"}
            </div>`}
          </div>
        </div>`;
    }

    /* ---------- Variant B: circular meters in the bar, icon rail ---------- */
    function ring(p, size) {
      const r = 9, c = 2 * Math.PI * r;
      const dash = c * (p.remaining == null ? 0 : p.remaining);
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="${r}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3"/>
        <circle cx="12" cy="12" r="${r}" fill="none" stroke="${fillColor(p.remaining)}" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 12 12)"/>
      </svg>`;
    }
    function variantB() {
      const sel = selected();
      const meters = pinned().map((p) => `
        <button data-open="${p.id}" title="${p.name}" style="
          width:30px;height:30px;border:0;background:transparent;cursor:pointer;padding:0;color:#fff;
          display:grid;place-items:center;opacity:${state.selected===p.id && state.popover?1:.82}">
          ${ring(p, 26)}
        </button>`).join("");
      const rail = PROVIDERS.map((p) => `
        <button class="pick" data-id="${p.id}" style="
          width:64px;border:0;background:${state.selected===p.id?"#1c1c1e":"transparent"};color:#eee;
          padding:10px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px">
          <span style="width:28px;height:28px;display:grid;place-items:center;color:${state.selected===p.id?"#fff":p.accent === "#111111" || p.accent === "#111" ? "#eee" : p.accent}">${mark(p.id, 18)}</span>
          <span style="width:28px;height:3px;border-radius:99px;background:#2a2a2e;overflow:hidden"><span class="bar-fill" style="width:${shownWidth(p.remaining)}%;background:${fillColor(p.remaining)}"></span></span>
          <span style="font:700 10px ui-monospace,monospace;opacity:.85">${displayPct(p.remaining)}</span>
        </button>`).join("");
      const windows = sel.windows.map((w) => `
        <div style="display:grid;grid-template-columns:92px 1fr 120px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #2a2a2e">
          <div style="font:600 13px Inter,sans-serif">${w.label}</div>
          <div class="bar-track" style="background:#2a2a2e;height:10px"><span class="bar-fill" style="width:${shownWidth(w.remaining)}%;background:${fillColor(w.remaining)}"></span></div>
          <div style="text-align:right;font:12px Inter,sans-serif;color:#9a9aaa">${displayPct(w.remaining)} · ${(w.reset || "").replace("Resets in ","")}</div>
        </div>`).join("");
      const body = state.view === "settings" ? settingsBody("B") : `
        <div style="display:grid;grid-template-columns:64px 1fr;min-height:400px;background:#111114;color:#f5f5f7">
          <aside style="background:#0b0b0d;display:flex;flex-direction:column;padding-top:8px">${rail}</aside>
          <section style="padding:20px 24px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font:700 20px Inter,sans-serif">${sel.name}</div>
              <div style="font:12px Inter,sans-serif;color:#888">${sel.plan}</div>
            </div>
            <div style="margin-top:18px">${windows}</div>
          </section>
        </div>`;
      return `
        <div style="height:100%;display:flex;flex-direction:column">
          <div style="height:var(--panel);display:flex;align-items:center;background:#000;color:#fff;padding:0 8px 0 12px">
            <span style="font:600 12px Ubuntu,sans-serif">Activities</span>
            <div style="flex:1"></div>
            ${state.exited ? "" : `
            <div style="display:flex;align-items:center;gap:4px;margin-right:8px;background:#1a1a1a;border-radius:16px;padding:2px 6px 2px 4px">
              <button data-ctrl="1" style="width:26px;height:26px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;cursor:pointer">P</button>
              ${meters}
            </div>`}
            ${gnomeClock()}
          </div>
          <div style="flex:1;position:relative">
            ${state.popover && !state.exited ? `
            <div style="position:absolute;top:0;right:72px;width:520px;overflow:hidden;
              border-radius:0 0 16px 16px;box-shadow:0 24px 70px rgba(0,0,0,.5)">${body}</div>` : ""}
          </div>
        </div>`;
    }

    /* ---------- Variant C: honest Adwaita / St.Widget ceiling ---------- */
    function variantC() {
      const sel = selected();
      const meters = pinned().map((p) => `
        <button data-open="${p.id}" style="
          display:flex;align-items:center;gap:5px;height:28px;padding:0 7px;border:0;cursor:pointer;
          background:${state.selected===p.id && state.popover ? "rgba(255,255,255,.12)" : "transparent"};color:#eee;
          font:13px Ubuntu,sans-serif">
          ${mark(p.id)}<span>${displayPct(p.remaining)}</span>
        </button>`).join("");
      const overview = PROVIDERS.map((p) => `
        <button class="pick" data-id="${p.id}" style="
          display:flex;align-items:center;gap:8px;width:100%;border:0;cursor:pointer;
          padding:8px 10px;background:${state.selected===p.id?"#3584e4":"transparent"};
          color:${state.selected===p.id?"#fff":"#2e3436"};font:13px Ubuntu,sans-serif;text-align:left">
          ${mark(p.id)}
          <span style="flex:1">${p.name}</span>
          <span>${displayPct(p.remaining)}</span>
        </button>`).join("");
      const windows = sel.windows.map((w) => `
        <div style="padding:10px 0;border-bottom:1px solid #d8d8d8">
          <div style="display:flex;justify-content:space-between;font:600 13px Ubuntu,sans-serif">
            <span>${w.label}${w.primary?"  (Primary)":""}</span>
            <span>${displayPct(w.remaining)}</span>
          </div>
          <div class="bar-track" style="margin-top:8px;background:#e6e6e6;height:8px;border-radius:2px">
            <span class="bar-fill" style="width:${shownWidth(w.remaining)}%;background:#3584e4;border-radius:2px"></span>
          </div>
          <div style="margin-top:4px;font:12px Ubuntu,sans-serif;color:#777">${w.reset}</div>
        </div>`).join("");
      const body = state.view === "settings" ? settingsBody("C") : `
        <div style="display:grid;grid-template-columns:200px 1fr;min-height:380px;background:#fafafa;color:#2e3436">
          <aside style="background:#f0f0f0;border-right:1px solid #dcdcdc;padding:6px 0">${overview}</aside>
          <section style="padding:16px 18px">
            <div style="font:700 16px Ubuntu,sans-serif">${sel.name} <span style="font-weight:500;color:#777;font-size:13px">${sel.plan}</span></div>
            <div style="margin-top:12px">${windows}</div>
          </section>
        </div>`;
      return `
        <div style="height:100%;display:flex;flex-direction:column;font-family:Ubuntu,Cantarell,sans-serif">
          <div style="height:var(--panel);display:flex;align-items:center;background:#1e1e1e;color:#eee;padding:0 8px 0 10px">
            <span style="font:15px Ubuntu,sans-serif">Activities</span>
            <div style="flex:1"></div>
            ${state.exited ? "" : `
            <div style="display:flex;align-items:center;margin-right:6px">
              <button data-ctrl="1" style="height:28px;padding:0 8px;border:0;background:${state.popover?"#2b2b2b":"transparent"};color:#eee;cursor:pointer;font:13px Ubuntu,sans-serif">PUB</button>
              ${meters}
            </div>`}
            ${gnomeClock()}
          </div>
          <div style="flex:1;position:relative">
            ${state.popover && !state.exited ? `
            <div style="position:absolute;top:6px;right:70px;width:480px;border-radius:12px;overflow:hidden;
              border:1px solid #c0c0c0;box-shadow:0 8px 24px rgba(0,0,0,.25);background:#fafafa">
              <div style="height:10px"></div>
              ${body}
            </div>` : `<div style="padding:72px 36px;color:#fff;font:16px Ubuntu,sans-serif">
              C 是 GNOME 扩展最容易做到的密度：无毛玻璃、12px 圆角、Ubuntu 字体、Adwaita 蓝条。A 的模糊和 22px 大圆角在 St.Widget 里做不到 1:1。
            </div>`}
          </div>
        </div>`;
    }

    function settingsBody(v) {
      const dark = v === "B";
      const fg = dark ? "#f5f5f7" : "#222";
      const bg = dark ? "#111114" : (v === "C" ? "#fafafa" : "transparent");
      const rows = PROVIDERS.map((p) => `
        <label style="display:flex;align-items:center;gap:10px;padding:8px 0;font:13px Inter,Ubuntu,sans-serif;color:${fg}">
          <input type="checkbox" data-en="${p.id}" checked />
          Enabled ${p.name}
          <span style="flex:1"></span>
          <input type="checkbox" data-pin="${p.id}" ${p.pinned ? "checked" : ""} />
          Pinned
        </label>`).join("");
      return `<div style="padding:18px 18px 16px;min-height:380px;background:${bg};color:${fg}">
        <div style="font:700 18px Inter,sans-serif;margin-bottom:12px">设置</div>
        <label style="display:flex;gap:8px;align-items:center;margin:10px 0;font:13px Inter,sans-serif">
          <input type="checkbox" id="modeRem" ${state.remainingMode ? "checked" : ""} />
          显示 Remaining（关掉则显示 used）
        </label>
        <div style="margin-top:16px">${rows}</div>
        <div style="margin-top:18px;font:12px Inter,sans-serif;opacity:.65">Primary Window 默认 Weekly / Monthly。v1 每 Provider 一块 Meter。</div>
      </div>`;
    }

    function honesty() {
      return {
        A: "Aspirational: 顶栏 frosted chip（图标+百分比+细条），Popover 64px 图标轨 + ~356px 详情。毛玻璃/圆角在 St.Widget 做不到 1:1。",
        B: "结构不同: 栏上圆环 Meter，Popover 是图标轨。圆环可用 Cairo/CSS 画，比 A 更「面板原生」。",
        C: "诚实天花板: Adwaita 密度。扩展默认就是这种控件语言。若 C 你能接受，GNOME 扩展稳；若必须 A，要自绘 CSS，且模糊会打折。",
      }[state.variant];
    }

    function render() {
      const root = document.getElementById("app");
      root.innerHTML = state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC();
      document.getElementById("switchLabel").textContent = `${state.variant} (${VARIANTS[state.variant].name})`;
      document.getElementById("stateDump").textContent =
        "PROTOTYPE · throwaway\n" + honesty() + "\n\n" + JSON.stringify({
          variant: state.variant, popover: state.popover, view: state.view,
          selected: state.selected, remainingMode: state.remainingMode,
          pinned: pinned().map((p) => p.id), exited: state.exited,
        }, null, 2);
      const menu = document.getElementById("ctxMenu");
      menu.classList.toggle("open", state.menu);
      menu.style.left = state.menuX + "px";
      menu.style.top = state.menuY + "px";
    }

    function setVariant(v) {
      state.variant = v;
      state.menu = false;
      const url = new URL(location.href);
      url.searchParams.set("variant", v);
      history.replaceState(null, "", url);
      render();
    }
    function cycle(dir) {
      const keys = Object.keys(VARIANTS);
      const i = keys.indexOf(state.variant);
      setVariant(keys[(i + dir + keys.length) % keys.length]);
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });

    document.getElementById("app").addEventListener("click", (e) => {
      const ctrl = e.target.closest("[data-ctrl]");
      const open = e.target.closest("[data-open]");
      const pick = e.target.closest(".pick");
      const settings = e.target.closest("[data-settings]");
      if (ctrl) {
        state.popover = !state.popover;
        state.view = "detail";
        state.menu = false;
        render();
        return;
      }
      if (settings) {
        state.view = "settings";
        state.popover = true;
        state.menu = false;
        render();
        return;
      }
      if (open) {
        state.selected = open.getAttribute("data-open");
        state.popover = true;
        state.view = "detail";
        state.menu = false;
        render();
        return;
      }
      if (pick) {
        state.selected = pick.getAttribute("data-id");
        state.view = "detail";
        render();
      }
    });
    document.getElementById("app").addEventListener("contextmenu", (e) => {
      const ctrl = e.target.closest("[data-ctrl]");
      if (!ctrl) return;
      e.preventDefault();
      state.menu = true;
      state.menuX = e.clientX;
      state.menuY = e.clientY;
      render();
    });
    document.getElementById("ctxMenu").addEventListener("click", (e) => {
      const act = e.target.getAttribute("data-act");
      if (act === "settings") { state.view = "settings"; state.popover = true; state.menu = false; }
      if (act === "exit") { state.exited = true; state.popover = false; state.menu = false; }
      if (act === "autostart") { state.autostart = !state.autostart; state.menu = false; }
      render();
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "modeRem") {
        state.remainingMode = e.target.checked;
        render();
      }
      const pin = e.target.getAttribute("data-pin");
      if (pin) {
        const p = PROVIDERS.find((x) => x.id === pin);
        p.pinned = e.target.checked;
        render();
      }
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".ctx-menu") && !e.target.closest("[data-ctrl]")) {
        if (state.menu) { state.menu = false; render(); }
      }
    });

    const q = new URLSearchParams(location.search).get("variant");
    state.variant = VARIANTS[q] ? q : "A";
    render();
  </script>
</body>
</html>
